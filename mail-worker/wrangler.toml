# cloud-mail-plus 部署配置 → 整份复制，替换 mail-worker/wrangler.toml
# 目标仓库：178hej/cloud-mail-plus
name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

# 自定义域 66.hej66.cc.cd、D1(db)、KV(kv)、R2 都在 Cloudflare 控制台绑定，
# 所以这里不写 routes / d1_databases / kv_namespaces / r2_buckets。
# 也别启用 name = "email" 的 send_email：优先级高于 Brevo，且需要 Workers 付费。

[[send_email]]
name = "forward"

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]

# domain / admin / jwt_secret / BREVO_API_KEY 全在控制台，这里必须留空，
# 写占位值会覆盖真实值，导致登录和 init 全废。
[vars]

# 仓库没有预编译 dist，这条负责打包前端，删掉会白屏或部署失败。
[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
